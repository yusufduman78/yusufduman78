<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="TECH STACK"><style>
.mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace} .sans{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.orbit{animation:orbit 6s linear infinite}
@keyframes orbit{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
@keyframes fade{to{opacity:1}}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}</style><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="1.6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0f1530"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/>
  <stop offset="1" stop-color="#f472b6"/>
</linearGradient>
<radialGradient id="nebV"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/>
  <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="nebC"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
  <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
</defs><g transform="translate(24 28) rotate(45)"><rect class="spin" x="-8" y="-8" width="16" height="16" fill="none" stroke="#a78bfa" stroke-width="2" filter="url(#softglow)"/><rect x="-3" y="-3" width="6" height="6" fill="#a78bfa"/></g><text class="mono" x="52" y="36" font-size="22" font-weight="800" letter-spacing="4" fill="#a78bfa" filter="url(#softglow)">TECH STACK</text><text class="mono" x="232" y="35" font-size="13" fill="#7c8aa5">// kullandığım araçlar</text><line x1="419" y1="30" x2="890" y2="30" stroke="#1e293b" stroke-width="1.5"/><circle r="3" cy="30" fill="#a78bfa" filter="url(#glow)"><animate attributeName="cx" values="419;890;419" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/></circle></svg>