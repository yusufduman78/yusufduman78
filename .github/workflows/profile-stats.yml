name: Update profile statistics

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/update_profile.py
      - assets/**
      - .github/workflows/profile-stats.yml
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards from GitHub data
        run: python scripts/update_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
      - name: Save updated statistics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
